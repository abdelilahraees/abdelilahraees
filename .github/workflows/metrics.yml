name: Generate metrics

on:
  schedule:
    # Tous les jours à 00h00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: abdelilahraees
          filename: github-metrics.svg
          committer_branch: output
          config_timezone: Africa/Casablanca

          # Sections de base : uniquement l'en-tête + l'activité (commits, PRs, issues)
          base: header, activity

          # Calendrier de contributions sur 6 mois
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
